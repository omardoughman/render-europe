name: Run macOS Script

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to manually trigger it from the GitHub website

jobs:
    macos-run:
      runs-on: macos-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Run start.py
          run: python start.py
